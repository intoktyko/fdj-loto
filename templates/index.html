<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator FDJ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; color: white; font-family: Arial, sans-serif; min-height: 100vh; padding: 20px; }
h1 { text-align: center; color: #e94560; font-size: 28px; padding: 20px 0; }
.container { max-width: 600px; margin: 0 auto; }
.card { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
label { font-size: 14px; color: #aaa; display: block; margin-bottom: 6px; }
select { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #0f3460; color: white; font-size: 15px; margin-bottom: 15px; }
button { width: 100%; padding: 15px; background: #e94560; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
button:hover { background: #c73652; }
.rezultat { text-align: center; }
.joc-titlu { font-size: 20px; font-weight: bold; color: #e94560; margin-bottom: 15px; }
.bile { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; }
.bila { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
.bila-main { background: #e94560; color: white; }
.bila-euro { background: #1a78c2; color: white; }
.bila-bonus { background: #f5a623; color: #1a1a2e; }
.bila-keno { background: #6c3483; color: white; }
.bonus-text { color: #f5a623; font-size: 14px; margin: 8px 0; }
.strat-text { color: #7ec8e3; font-size: 13px; }
.separator { color: white; font-size: 20px; display: flex; align-items: center; }
.istoric { background: #0f3460; border-radius: 8px; padding: 15px; max-height: 200px; overflow-y: auto; }
.istoric p { font-size: 12px; color: #a8dadc; font-family: monospace; padding: 3px 0; border-bottom: 1px solid #1a3a6e; }
.btn-sterge { background: #0f3460; margin-top: 10px; font-size: 14px; padding: 10px; }
.btn-sterge:hover { background: #1a4a8e; }
</style>
</head>
<body>
<div class="container">
  <h1>🎰 GENERATOR FDJ</h1>

  <div class="card">
    <label>Joc:</label>
    <select id="joc">
      <option value="loto">🎱 Loto 6/49</option>
      <option value="euro">⭐ EuroMillions</option>
      <option value="keno">🎰 Keno 20/70</option>
    </select>

    <label>Strategie:</label>
    <select id="strat">
      <option value="mixta">🤖 Mixta (IA) — Recomandata</option>
      <option value="frecventa">📊 Frecventa istorica</option>
      <option value="retardataire">⏰ Retardataire</option>
      <option value="aleatorie">🎲 Aleatorie</option>
    </select>

    <button onclick="genereaza()">✨ GENEREAZA NUMERE</button>
  </div>

  <div class="card rezultat" id="rezultat" style="display:none;">
    <div class="joc-titlu" id="joc-titlu"></div>
    <div class="bile" id="bile"></div>
    <div class="bonus-text" id="bonus-text"></div>
    <div class="strat-text" id="strat-text"></div>
  </div>

  <div class="card">
    <label>📋 Istoric generari:</label>
    <div class="istoric" id="istoric"><p style="color:#555;">Nicio generare inca...</p></div>
    <button class="btn-sterge" onclick="stergeIstoric()">🗑 Sterge istoric</button>
  </div>
</div>

<script>
let nr = 0;

async function genereaza() {
  const joc = document.getElementById("joc").value;
  const strat = document.getElementById("strat").value;

  const resp = await fetch("/genereaza", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({joc, strat})
  });
  const data = await resp.json();

  document.getElementById("rezultat").style.display = "block";
  document.getElementById("joc-titlu").textContent = data.joc;

  const bile = document.getElementById("bile");
  bile.innerHTML = "";

  let clasa = joc === "euro" ? "bila-euro" : joc === "keno" ? "bila-keno" : "bila-main";

  data.numere.forEach(n => {
    const b = document.createElement("div");
    b.className = "bila " + clasa;
    b.textContent = n;
    bile.appendChild(b);
  });

  if (data.bonus.length > 0) {
    const sep = document.createElement("div");
    sep.className = "separator";
    sep.textContent = " + ";
    bile.appendChild(sep);

    data.bonus.forEach(n => {
      const b = document.createElement("div");
      b.className = "bila bila-bonus";
      b.textContent = n;
      bile.appendChild(b);
    });

    if (data.tip_bonus === "chance") {
      document.getElementById("bonus-text").textContent = "Numero Chance: " + data.bonus[0];
    } else {
      document.getElementById("bonus-text").textContent = "Stele: " + data.bonus.join(", ");
    }
  } else {
    document.getElementById("bonus-text").textContent = "";
  }

  document.getElementById("strat-text").textContent = "Strategie: " + strat;

  nr++;
  const ist = document.getElementById("istoric");
  if (nr === 1) ist.innerHTML = "";
  const p = document.createElement("p");
  p.textContent = "#" + nr + " | " + data.joc + " | " + data.numere.join(", ") + (data.bonus.length ? " + " + data.bonus.join(", ") : "") + " | " + strat;
  ist.insertBefore(p, ist.firstChild);
}

function stergeIstoric() {
  document.getElementById("istoric").innerHTML = '<p style="color:#555;">Nicio generare inca...</p>';
  nr = 0;
}
</script>
</body>
</html>
